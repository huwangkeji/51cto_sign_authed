    var MINI_PROGRAM_TIMER;
    // 获取二维码
    function getMiniProgramQrCode() {
        $('.qr-img').attr('src', 'https://s1.51cto.com/images/blog/201902/18/8cef164920182ec17d7bf92cf48c00bc.gif');
        clearInterval(fetchMiniProgramScanPull);
        $.getJSON('/miniv1/get-qrcode', function(data){
            if (data.status == 0){
                stopMiniProgramScanPull();
                $('.wx_10s').hide();
                $('.wx_0s').show();
                $('.qr-img').attr('src', data.data.url);
                if(!MINI_PROGRAM_TIMER){
                    MINI_PROGRAM_TIMER = setInterval(() => {
                        fetchMiniProgramScanPull(data.data.scene);
                    }, 2000) ;
                }
            } else {
                $('.wx_0s').hide();
                $('.wx_10s').show();
                stopMiniProgramScanPull();
            }
        });
     }

     // 小程序扫码登录轮询
     function fetchMiniProgramScanPull(scene) {
        var timestamp = Date.parse(new Date());
         $.getJSON('/miniv1/scan-pull?scene='+scene, function(data){
            if (data.status == 0){
                if(data.data.step == 2) {
                    // 已扫描
                } else if (data.data.step == 4){
                    // 已登录
                    window.location.href = target_url;
                } else if(data.data.step == 5) {
                    // 已过期
                    $('.wx_10s').show();
                    stopMiniProgramScanPull();
                }
            }else{
                $('.wx_10s').show();
                stopMiniProgramScanPull();
            }
         });
     }

     // 停止轮询
     function stopMiniProgramScanPull() {
        if (MINI_PROGRAM_TIMER){
             clearTimeout(MINI_PROGRAM_TIMER);
             MINI_PROGRAM_TIMER = null;
         }
     }
